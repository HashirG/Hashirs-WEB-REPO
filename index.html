<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stay Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #1F3A32;
    --pine-dark: #16281F;
    --parchment: #F3E1DE;
    --card: #FFFFFF;
    --ink: #2A2420;
    --ink-soft: #6B6156;
    --amber: #C98A3E;
    --sage: #E4E9DC;
    --line: #E7E0D2;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--parchment);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .page {
    width: 100%;
    max-width: 440px;
  }

  .masthead {
    text-align: left;
    margin-bottom: 18px;
    padding: 0 4px;
  }

  .masthead h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 4px;
    color: var(--pine-dark);
  }

  .masthead p {
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(42, 36, 32, 0.04), 0 8px 24px rgba(42, 36, 32, 0.06);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 600px;
  }

  .property-select {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--parchment);
  }

  .property-select label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .select-wrap {
    position: relative;
  }

  .select-wrap::after {
    content: "";
    position: absolute;
    right: 14px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--ink-soft);
    border-bottom: 2px solid var(--ink-soft);
    transform: translateY(-65%) rotate(45deg);
    pointer-events: none;
  }

  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 36px 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }

  select:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .messages:empty::before {
    content: "Choose your property above, then say hello.";
    color: var(--ink-soft);
    font-size: 14px;
    margin: auto;
    text-align: center;
    padding: 0 20px;
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
  }

  .msg.guest {
    align-self: flex-end;
    background: var(--pine);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.host {
    align-self: flex-start;
    background: var(--sage);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: center;
    background: transparent;
    color: #A24A3F;
    font-size: 13px;
    text-align: center;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 10px 14px;
    background: var(--sage);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    opacity: 0.5;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--line);
    background: var(--card);
  }

  input[type="text"] {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--parchment);
  }

  input[type="text"]:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }

  input[type="text"]:disabled {
    opacity: 0.6;
  }

  button {
    border: none;
    background: var(--amber);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button:not(:disabled):hover {
    opacity: 0.9;
  }

  @media (prefers-reduced-motion: reduce) {
    .typing span { animation: none; }
  }

  @media (max-width: 480px) {
    .card { height: 80vh; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="masthead">
    <h1>Stay Concierge</h1>
    <p>Questions about your stay, answered any time.</p>
  </div>

  <div class="card">
    <div class="property-select">
      <label for="property">Your property</label>
      <div class="select-wrap">
        <select id="property">
          <option value="" disabled selected>Select a property…</option>
          <option value="Downtown NYC">Downtown NYC </option>
          <option value="Riverside Cabin">Riverside Cabin</option>
          <option value="Avenue 4 Cornerside">Avenue 4 Cornerside</option>
        </select>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Select a property to start…" autocomplete="off" disabled />
      <button type="submit" id="send-btn" disabled>Send</button>
    </form>
  </div>
</div>

<script>
  // ---- Configuration ----
  const WEBHOOK_URL = "https://YOUR-N8N-INSTANCE/webhook/concierge"; // <-- replace with your n8n Chat Trigger webhook URL

  // ---- State ----
  const sessionId = crypto.randomUUID();
  let propertyId = null;

  const propertySelect = document.getElementById("property");
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");

  propertySelect.addEventListener("change", (e) => {
    propertyId = e.target.value;
    input.disabled = false;
    sendBtn.disabled = false;
    input.placeholder = "Type a message…";
    input.focus();

    const label = e.target.options[e.target.selectedIndex].text;
    addMessage(`Connected to ${label}. How can I help with your stay?`, "host");
  });

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing-indicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !propertyId) return;

    addMessage(text, "guest");
    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chatInput: text,
          sessionId: sessionId,
          metadata: { propertyId: propertyId }
        })
      });

      if (!response.ok) throw new Error("Request failed");

      const data = await response.json();
      hideTyping();

      const reply = data.output || data.text || data.message || "Sorry, I didn't catch that — could you try again?";
      addMessage(reply, "host");
    } catch (err) {
      hideTyping();
      addMessage("Couldn't reach the concierge. Please try again in a moment.", "error");
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
